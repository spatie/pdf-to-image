name: run-tests

on: [push, pull_request]

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                php: ['8.6', '8.5', '8.4', '8.3', '8.2']
                dependency-version: [prefer-lowest, prefer-stable]
                os: [ubuntu-latest]

        name: P${{ matrix.php }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

        steps:
            -   name: Upgrade ghostscript
                run: |
                    sudo apt-get update
                    sudo apt-get install ghostscript

            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, imagick
                  coverage: pcov

            - name: Verify PHP version
              run: |
                  php -r 'echo PHP_VERSION, PHP_EOL; exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === "${{ matrix.php }}" ? 0 : 1);'

            - name: Fix Imagick Policy
              run: |
                sudo sed -i 's/none/read|write/g' /etc/ImageMagick-*/policy.xml
                sudo sed -i -E 's/[0-9]+MP"/3GiB"/g' /etc/ImageMagick-*/policy.xml


            - name: Install dependencies
              run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

            - name: Setup Problem Matches
              run: |
                  echo "::add-matcher::${{ runner.tool_cache }}/php.json"
                  echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            - name: Execute tests
              run: vendor/bin/pest --parallel

    # Keep password-protected PDF coverage on ImageMagick 7 regardless of the runner's version.
    test-password-protected-pdfs:
        runs-on: ubuntu-latest
        container: debian:trixie

        name: Password-protected PDFs - ImageMagick 7

        steps:
            - name: Install ImageMagick 7, PHP and ghostscript
              run: |
                  apt-get update
                  apt-get install -y php-cli php-imagick php-xml php-mbstring php-zip php-curl php-pcov ghostscript composer git unzip

            - name: Checkout code
              uses: actions/checkout@v7

            - name: Fix Imagick Policy
              run: |
                  sed -i 's/rights="none"/rights="read|write"/g' /etc/ImageMagick-7/policy.xml
                  sed -i -E 's/[0-9]+MP"/3GiB"/g' /etc/ImageMagick-7/policy.xml

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction

            - name: Execute tests
              run: vendor/bin/pest --parallel
